#cloud-config
# Runs once on the VM's first boot: installs Docker, clones the repo and starts the whole system.
# Progress: ssh into the VM and run `cloud-init status --wait` or `tail -f /var/log/cloud-init-output.log`.
# __REPO_URL__, __REPO_BRANCH__ and __ADMIN_USER__ are filled in by up.sh.

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git

# 2 GB of swap: margin for the first start, when the images build while Nominatim imports the map.
swap:
  filename: /swapfile
  size: 2G

runcmd:
  - usermod -aG docker __ADMIN_USER__
  - systemctl enable --now docker
  - git clone --depth 1 --branch __REPO_BRANCH__ __REPO_URL__ /opt/shared-courier-pooling
  - chown -R __ADMIN_USER__:__ADMIN_USER__ /opt/shared-courier-pooling
  # Map data for OSRM and Nominatim (downloads ~400 MB from Geofabrik).
  - cd /opt/shared-courier-pooling && sudo -u __ADMIN_USER__ ./osrm/prepare.sh
  # Host settings for every later `docker compose` run too (compose reads .env on its own): the app on port 80.
  - echo "FRONTEND_PORT=80" > /opt/shared-courier-pooling/.env
  # Whole system.
  - cd /opt/shared-courier-pooling && docker compose --profile app up -d --build
