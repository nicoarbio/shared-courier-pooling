spring:
  application:
    name: mercier
  datasource:
    url: jdbc:postgresql://localhost:5432/mercier
    username: mercier
    password: mercier
  mvc:
    # Errors as RFC 9457 problem details, including validation errors.
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only checks the entities match it.
      ddl-auto: validate
  flyway:
    # Seed data (db/seed, repeatable migrations) is only loaded by the "local" profile. Tolerate it being
    # recorded in the database when running without that profile; versioned schema migrations stay strict.
    ignore-migration-patterns: "repeatable:missing"

mercier:
  # Delivery windows and estimated times are wall-clock times in this zone.
  time-zone: America/Argentina/Buenos_Aires
  pooling:
    radius-meters: 500
    window-tolerance: 15m
    # Calibrated on the case study: $2,500 per dedicated single-order trip / 1.974 km average round trip.
    price-per-km: 1266
    stop-service-time: 2m
  geocoding:
    nominatim-url: http://localhost:8088
    # Delivery-area search box around the merchant (well beyond the 500 m pooling radius).
    search-radius-meters: 2000
    max-results: 5
  osrm:
    routing-url: http://localhost:5000
    proximity-url: http://localhost:5001
