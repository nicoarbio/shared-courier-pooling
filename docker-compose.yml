services:
  # Routing engine (respects one-way streets). Requires running osrm/prepare.sh first.
  osrm-routing:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/caba.osrm
    volumes:
      - ./osrm/data/routing:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

  # Same street network with one-way handling disabled: used only to group orders by proximity.
  osrm-proximity:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/caba.osrm
    volumes:
      - ./osrm/data/proximity:/data:ro
    ports:
      - "5001:5000"
    restart: unless-stopped

  # Geocoder (address -> coordinates) over the same CABA extract as OSRM (osrm/prepare.sh).
  # The first start imports the extract into its own database (~7 min); later starts reuse the volume.
  nominatim:
    image: mediagis/nominatim:4.5
    environment:
      PBF_PATH: /osm/caba.osm.pbf
      IMPORT_STYLE: full
      THREADS: 4
      NOMINATIM_PASSWORD: nominatim
    volumes:
      # Mounted outside /nominatim: the image takes ownership of everything under that path.
      - ./osrm/data/caba.osm.pbf:/osm/caba.osm.pbf:ro
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1g
    ports:
      - "8088:8080"
    restart: unless-stopped

  # Database for the backend (local development credentials).
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mercier
      POSTGRES_USER: mercier
      POSTGRES_PASSWORD: mercier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercier -d mercier"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # The application itself, under the "app" profile: `docker compose up -d` keeps starting only the
  # infrastructure (for development); `docker compose --profile app up -d --build` runs the whole system.
  backend:
    build: ./backend
    profiles: ["app"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mercier
      MERCIER_OSRM_ROUTING_URL: http://osrm-routing:5000
      MERCIER_OSRM_PROXIMITY_URL: http://osrm-proximity:5000
      MERCIER_GEOCODING_NOMINATIM_URL: http://nominatim:8080
      # Also load the case study shops (db/seed).
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
    depends_on:
      postgres:
        condition: service_healthy
      osrm-routing:
        condition: service_started
      osrm-proximity:
        condition: service_started
      nominatim:
        condition: service_started
    restart: unless-stopped
    # No published port: reached through the frontend's nginx (same origin).

  frontend:
    build: ./frontend
    profiles: ["app"]
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

  # Web route viewer on top of the local OSRM (visual checks only; not part of the system).
  # Started separately: docker compose --profile tools up -d osrm-frontend  →  http://localhost:9966
  # The image only publishes the "latest" tag (2019); pinned by digest for reproducibility.
  osrm-frontend:
    image: osrm/osrm-frontend@sha256:f8f0fa79aa3b88ca9e3a78553bd06abdf842070911fac7e2a3f4d1e6ca8bf861
    profiles: ["tools"]
    # The bundled Mapbox token was revoked (tiles return 401): default to OpenStreetMap tiles.
    command: ["sh", "-c", "sed -i \"s/\\['Mapbox Streets'\\]/['openstreetmap.org']/\" src/index.js && npm start"]
    environment:
      OSRM_BACKEND: http://localhost:5000   # queried by the browser, not the container
      OSRM_CENTER: "-34.6205,-58.4440"      # Yerbal & Félix Lora, Caballito (lat,lon)
      OSRM_ZOOM: "16"
      OSRM_LANGUAGE: es
    ports:
      - "9966:9966"
    depends_on:
      - osrm-routing

volumes:
  postgres-data:
  nominatim-data:
