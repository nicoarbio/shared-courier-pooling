services:
  # Routing engine (respects one-way streets). Requires running osrm/prepare.sh first.
  osrm-routing:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/caba.osrm
    volumes:
      - ./osrm/data/routing:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

  # Same street network with one-way handling disabled: used only to group orders by proximity.
  osrm-proximity:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/caba.osrm
    volumes:
      - ./osrm/data/proximity:/data:ro
    ports:
      - "5001:5000"
    restart: unless-stopped

  # Database for the backend (local development credentials).
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mercier
      POSTGRES_USER: mercier
      POSTGRES_PASSWORD: mercier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercier -d mercier"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Web route viewer on top of the local OSRM (visual checks only; not part of the system).
  # Started separately: docker compose --profile tools up -d osrm-frontend  →  http://localhost:9966
  # The image only publishes the "latest" tag (2019); pinned by digest for reproducibility.
  osrm-frontend:
    image: osrm/osrm-frontend@sha256:f8f0fa79aa3b88ca9e3a78553bd06abdf842070911fac7e2a3f4d1e6ca8bf861
    profiles: ["tools"]
    # The bundled Mapbox token was revoked (tiles return 401): default to OpenStreetMap tiles.
    command: ["sh", "-c", "sed -i \"s/\\['Mapbox Streets'\\]/['openstreetmap.org']/\" src/index.js && npm start"]
    environment:
      OSRM_BACKEND: http://localhost:5000   # queried by the browser, not the container
      OSRM_CENTER: "-34.6205,-58.4440"      # Yerbal & Félix Lora, Caballito (lat,lon)
      OSRM_ZOOM: "16"
      OSRM_LANGUAGE: es
    ports:
      - "9966:9966"
    depends_on:
      - osrm-routing

volumes:
  postgres-data:
