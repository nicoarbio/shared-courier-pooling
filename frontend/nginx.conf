# Serves the Angular app and forwards API calls to the backend, so the browser sees a single origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Backend: REST API and its OpenAPI docs (Swagger UI).
    location ~ ^/(api|swagger-ui|v3/api-docs)(/|\.html|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;  # keeps the port, for correct redirects (Swagger UI)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change: cache them for long.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/comercio/..., /repartidor/...) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
